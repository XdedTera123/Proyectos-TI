
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <title>Topología lógica de AndesTech S.A.C.</title>
  <rect width="1200" height="660" fill="#F8FAFC"/>

  <text x="600" y="46" text-anchor="middle"
        font-family="Arial" font-size="27" font-weight="bold"
        fill="#172B4D">ANDESTECH S.A.C.</text>
  <text x="600" y="72" text-anchor="middle"
        font-family="Arial" font-size="15"
        fill="#64748B">Topología lógica de red empresarial — Versión 1.0</text>

  <!-- Router -->
  <rect x="465" y="100" width="270" height="98" rx="14" fill="#243E60"/>
  <text x="600" y="128" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="bold"
        fill="white">R1-CORE</text>
  <text x="600" y="151" text-anchor="middle"
        font-family="Arial" font-size="15" fill="#DFEAF7">Cisco 2911</text>
  <text x="600" y="175" text-anchor="middle"
        font-family="Arial" font-size="13" fill="#DFEAF7">Routing / DHCP / ACL</text>

  <!-- Trunk -->
  <line x1="600" y1="198" x2="600" y2="290"
        stroke="#64748B" stroke-width="5"/>
  <text x="625" y="229" font-family="Arial"
        font-size="14" font-weight="bold" fill="#334155">802.1Q Trunk</text>
  <text x="625" y="249" font-family="Arial"
        font-size="12" fill="#64748B">R1 G0/0 ↔ SW1 G0/1</text>
  <text x="625" y="266" font-family="Arial"
        font-size="12" fill="#64748B">VLAN 10, 20, 30, 40</text>

  <!-- Switch -->
  <rect x="465" y="290" width="270" height="83" rx="14" fill="#28749C"/>
  <text x="600" y="320" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="bold"
        fill="white">SW1-CORE</text>
  <text x="600" y="347" text-anchor="middle"
        font-family="Arial" font-size="15" fill="#E7F5FC">Cisco 2960-24TT</text>

  <!-- Access links -->
  <path d="M500 373 V399 H155 V467" stroke="#3A82B9"
        stroke-width="4" fill="none"/>
  <path d="M565 373 V412 H450 V467" stroke="#BD9136"
        stroke-width="4" fill="none"/>
  <path d="M635 373 V425 H750 V467" stroke="#398D68"
        stroke-width="4" fill="none"/>
  <path d="M700 373 V438 H1045 V467" stroke="#8868AD"
        stroke-width="4" fill="none"/>

  <!-- VLAN 10 -->
  <rect x="35" y="467" width="240" height="145"
        rx="13" fill="#DFEDF8" stroke="#3A82B9" stroke-width="2"/>
  <text x="155" y="492" text-anchor="middle" font-family="Arial"
        font-size="18" font-weight="bold" fill="#215B85">VLAN 10</text>
  <text x="155" y="516" text-anchor="middle" font-family="Arial"
        font-size="15" fill="#215B85">ADMINISTRACIÓN</text>
  <text x="155" y="540" text-anchor="middle" font-family="Arial"
        font-size="14" fill="#215B85">PC-ADMIN — Fa0/1</text>
  <text x="155" y="562" text-anchor="middle" font-family="Arial"
        font-size="14" fill="#215B85">192.168.10.0/24</text>
  <text x="155" y="584" text-anchor="middle" font-family="Arial"
        font-size="13" fill="#215B85">GW: 192.168.10.1</text>
  <text x="155" y="601" text-anchor="middle" font-family="Arial"
        font-size="12" fill="#215B85">DHCP</text>

  <!-- VLAN 20 -->
  <rect x="330" y="467" width="240" height="145"
        rx="13" fill="#F7EBCF" stroke="#BD9136" stroke-width="2"/>
  <text x="450" y="492" text-anchor="middle" font-family="Arial"
        font-size="18" font-weight="bold" fill="#835A16">VLAN 20</text>
  <text x="450" y="516" text-anchor="middle" font-family="Arial"
        font-size="15" fill="#835A16">FINANZAS</text>
  <text x="450" y="540" text-anchor="middle" font-family="Arial"
        font-size="14" fill="#835A16">PC-FIN — Fa0/2</text>
  <text x="450" y="562" text-anchor="middle" font-family="Arial"
        font-size="14" fill="#835A16">192.168.20.0/24</text>
  <text x="450" y="584" text-anchor="middle" font-family="Arial"
        font-size="13" fill="#835A16">GW: 192.168.20.1</text>
  <text x="450" y="601" text-anchor="middle" font-family="Arial"
        font-size="12" fill="#835A16">DHCP</text>

  <!-- VLAN 30 -->
  <rect x="630" y="467" width="240" height="145"
        rx="13" fill="#DFF2E7" stroke="#398D68" stroke-width="2"/>
  <text x="750" y="492" text-anchor="middle" font-family="Arial"
        font-size="18" font-weight="bold" fill="#246747">VLAN 30</text>
  <text x="750" y="516" text-anchor="middle" font-family="Arial"
        font-size="15" fill="#246747">TI</text>
  <text x="750" y="540" text-anchor="middle" font-family="Arial"
        font-size="14" fill="#246747">PC-IT — Fa0/3</text>
  <text x="750" y="562" text-anchor="middle" font-family="Arial"
        font-size="14" fill="#246747">192.168.30.0/24</text>
  <text x="750" y="584" text-anchor="middle" font-family="Arial"
        font-size="13" fill="#246747">GW: 192.168.30.1</text>
  <text x="750" y="601" text-anchor="middle" font-family="Arial"
        font-size="12" fill="#246747">DHCP</text>

  <!-- VLAN 40 -->
  <rect x="925" y="467" width="240" height="145"
        rx="13" fill="#ECE3F8" stroke="#8868AD" stroke-width="2"/>
  <text x="1045" y="492" text-anchor="middle" font-family="Arial"
        font-size="18" font-weight="bold" fill="#67488E">VLAN 40</text>
  <text x="1045" y="516" text-anchor="middle" font-family="Arial"
        font-size="15" fill="#67488E">SERVIDORES</text>
  <text x="1045" y="540" text-anchor="middle" font-family="Arial"
        font-size="14" fill="#67488E">SRV-INTRANET — Fa0/4</text>
  <text x="1045" y="562" text-anchor="middle" font-family="Arial"
        font-size="14" fill="#67488E">192.168.40.10/24</text>
  <text x="1045" y="584" text-anchor="middle" font-family="Arial"
        font-size="13" fill="#67488E">GW: 192.168.40.1</text>
  <text x="1045" y="601" text-anchor="middle" font-family="Arial"
        font-size="12" fill="#67488E">DNS / HTTP</text>

  <text x="600" y="642" text-anchor="middle"
        font-family="Arial" font-size="13" fill="#64748B">
    Diseño propuesto — Pendiente de implementación y validación en Cisco Packet Tracer
  </text>
</svg>
